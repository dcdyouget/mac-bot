[package]
name = "macbot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "0.7"
macbot-client-core = { path = "../macbot-client-core" }
macbot-desktop-services = { path = "../macbot-desktop-services" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", features = ["NSObject", "NSString"] }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
