[package]
name = "macbot-desktop"
version = "0.1.0"
description = "Mac Bot desktop application"
authors = ["Mac Bot"]
edition = "2021"

[workspace]

[lib]
name = "macbot_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
macbot-client-core = { path = "../../crates/macbot-client-core" }
macbot-desktop-services = { path = "../../crates/macbot-desktop-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sys-locale = "0.3"
bytes = "1"
futures-util = "0.3"
mime_guess = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
