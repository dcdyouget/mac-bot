[package]
name = "macbot-desktop"
version = "0.1.0"
description = "Mac Bot desktop application"
authors = ["Mac Bot"]
edition = "2021"

[workspace]

[lib]
name = "macbot_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
macbot-client-core = { path = "../../crates/macbot-client-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
