[package]
name = "macbot-protocol"
version = "0.1.0"
edition = "2021"
description = "Mac Bot client/server protocol types"
license = "MIT"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "generate-schema"
path = "src/bin/generate-schema.rs"

[[bin]]
name = "generate-fixtures"
path = "src/bin/generate-fixtures.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["chrono"] }

[dev-dependencies]
serde_json = "1"
