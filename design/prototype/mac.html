<!doctype html>
<html lang="zh-CN" data-theme="light" data-material="translucent">
<head>
<meta charset="utf-8">
<title>Mac Bot · macOS 客户端原型</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
/* ===== Window ===== spec: 03-macos.md */
.screens { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: -24px 0 20px; }
.screens button { height: 24px; padding: 0 9px; border-radius: 13px; font-size: 12px; color: var(--text-secondary); background: var(--bg-elevated); box-shadow: 0 0 0 1px var(--border-subtle); }
.screens button.on { background: var(--accent); color: var(--accent-on); box-shadow: none; }
.win { width: 1280px; height: 820px; margin: 0 auto; border-radius: 12px; overflow: hidden; position: relative; display: flex;
  background: var(--bg-window); box-shadow: 0 30px 80px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.25), inset 0 0 0 .5px rgba(255,255,255,.15); }
[data-theme='dark'] .win { box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.12); }
.lights { position: absolute; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 5; }
.lights span { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights span:nth-child(2) { background: #FEBC2E; } .lights span:nth-child(3) { background: #28C840; }

/* Sidebar 260 */
.sb { width: 260px; flex: none; display: flex; flex-direction: column; background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); }
.sb-top { height: 52px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px 0 84px; gap: 2px; }
.host { display: flex; align-items: center; gap: 6px; white-space: nowrap; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-right: auto; margin-left: -6px; }
.host:hover { background: var(--bg-hover); }
.host .on { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
.sb-search { margin: 0 12px 8px; height: 28px; border-radius: 8px; background: var(--bg-active); display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--text-tertiary); font-size: 13px; }
.sb-scroll { flex: 1; overflow: auto; padding: 0 8px 8px; }
.chatrow { display: flex; gap: 10px; align-items: center; height: 60px; padding: 0 8px; border-radius: 10px; position: relative; }
.chatrow:hover { background: var(--bg-hover); }
.chatrow.sel { background: var(--bg-selected); }
.chatrow .l1 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; line-height: 18px; }
.chatrow .l1 .time { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--text-tertiary); }
.chatrow .l2 { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--text-secondary); margin-top: 2px; }
.chatrow .l2 .ellipsis { flex: 1; }
.chatrow .tag { font-size: 11px; font-weight: 500; color: var(--text-tertiary); }
.botrow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; }
.botrow:hover { background: var(--bg-hover); }
.botrow .st { margin-left: auto; font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
.navrow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); }
.navrow:hover { background: var(--bg-hover); color: var(--text-primary); }
.navrow.sel { background: var(--bg-active); color: var(--text-primary); }
.navrow .r { margin-left: auto; font-size: 11px; }
.sb-foot { padding: 8px; border-top: 1px solid var(--border-subtle); }

/* Main */
.main { flex: 1; min-width: 480px; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
.toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-window); }
.toolbar .tt { font-size: 14px; font-weight: 600; line-height: 18px; }
.toolbar .ts { font-size: 11px; line-height: 14px; color: var(--text-secondary); display: flex; gap: 8px; align-items: center; }
.statusbar { display: flex; gap: 4px; padding: 6px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-window); align-items: center; }
.pinned { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-window); font-size: 12px; }
.pinned .bar { width: 2px; height: 24px; border-radius: 1px; background: var(--accent); }
.scroll { flex: 1; overflow: auto; }
.center { max-width: 760px; margin: 0 auto; }

/* Right panel 280 */
.panel { width: 280px; flex: none; display: flex; flex-direction: column; background: var(--bg-panel); border-left: 1px solid var(--border-subtle); }
.panel-h { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--border-subtle); }
.panel-h .t { font-size: 13px; font-weight: 600; margin-right: auto; }
.listcol { width: 260px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); background: var(--bg-panel); }
.panel-b { flex: 1; overflow: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 20px; }
.psec .ph { display: flex; align-items: center; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .3px; height: 20px; margin-bottom: 6px; }
.psec .ph .r { margin-left: auto; font-weight: 500; }
.kv2 { display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; font-size: 13px; line-height: 18px; }
.kv2 dt { color: var(--text-tertiary); }
.mrow { display: flex; align-items: center; gap: 8px; height: 36px; font-size: 13px; }
.mrow .role { color: var(--text-tertiary); font-size: 12px; }
.prow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border-subtle); font-size: 13px; }
.prow:first-of-type { border-top: 0; }

/* trace */
.tl { font-size: 13px; }
.tli { display: grid; grid-template-columns: 64px 20px 1fr auto; gap: 0 8px; align-items: start; padding: 6px 0; }
.tli .tm { font-family: var(--font-family-mono); font-size: 11px; color: var(--text-tertiary); line-height: 20px; }
.tli .ico { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--bg-active); color: var(--text-secondary); }
.tli .ico.model { background: var(--accent-soft); color: var(--accent); }
.tli .ico.steer { background: var(--warning-soft); color: var(--warning); }
.tli .ico.sub { background: var(--review-soft); color: var(--review); }
.tli .bd { line-height: 20px; min-width: 0; }
.tli .rs { font-size: 12px; color: var(--text-secondary); line-height: 20px; white-space: nowrap; }
.tli .sub { margin-top: 4px; padding-left: 12px; border-left: 1.5px solid var(--border-default); font-size: 12px; color: var(--text-secondary); line-height: 18px; }
.term { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: #1C1C1E; color: #D6D6D8; font-family: var(--font-family-mono); font-size: 12px; line-height: 18px; }
[data-theme='dark'] .term { background: #0C0C0D; }

/* stat cards / dashboard */
.stat { padding: 14px 16px; }
.stat .k { font-size: 12px; color: var(--text-secondary); }
.stat .v { font-size: 24px; font-weight: 600; letter-spacing: -.4px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 11px; margin-top: 2px; }
.up { color: var(--success); } .down { color: var(--danger); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; }
.heat i { width: 11px; height: 11px; border-radius: 2.5px; display: block; }
.overlay { position: absolute; inset: 0; background: var(--bg-overlay); display: flex; align-items: flex-start; justify-content: center; padding-top: 96px; z-index: 20; }
.dialog { width: 560px; background: var(--bg-elevated); border-radius: 14px; box-shadow: var(--elevation-4); overflow: hidden; }
[data-material='translucent'] .dialog { backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); }
.hover-tools { position: absolute; top: -14px; right: 8px; display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--bg-elevated); box-shadow: var(--elevation-2); }
.hover-tools .iconbtn { width: 24px; height: 24px; }
.waitline { color: var(--warning) !important; font-weight: 500; }
.chatrow.attn::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--warning); }
.arow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border-subtle); font-size: 13px; }
.arow:first-of-type { border-top: 0; }
.by { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); height: 18px; padding: 0 6px 0 2px; border-radius: 9px; background: var(--bg-active); }
.md h1 { font-size: 22px; line-height: 28px; margin: 0 0 12px; } .md h2 { font-size: 16px; margin: 20px 0 8px; } .md p, .md li { font-size: 14px; line-height: 22px; } .md ul { padding-left: 20px; }
</style>
</head>
<body>
<div class="wallpaper">
  <div class="screens" id="screens"></div>
  <div class="win" id="win"></div>
  <p class="t-foot" style="text-align:center;margin-top:16px">窗口 1280 × 820 · 侧栏 260 · 列表栏 260 · 会话区 ≥ 480 · 右面板 280 · 标题栏 52 · 红绿灯 (20, 18)。尺寸详见 03-macos.md</p>
</div>
<script src="shared.js"></script>
<script src="blocks.js"></script>
<script>
const C = (i) => `var(--avatar-${i})`;
const BOT = { Z: ['总管', 0], P: ['产品', 1], C: ['编码', 2], T: ['测试', 3], R: ['调研', 4], X: ['X 侦察', 5], B: ['比价', 6] };
function av(k, s = 32, o = {}) {
  const [, c] = BOT[k];
  return `<div class="av s${s}" style="--c:${C(c)}">${k === 'Z' ? GLASSES : ''}${o.dot ? `<span class="dot ${o.dot}"></span>` : ''}${o.ring ? '<span class="ring-working"></span>' : ''}</div>`;
}
const gav = (ks, s = 40) => `<div class="gav s${s} n${Math.min(ks.length, 4)}">${ks.slice(0, 4).map((k) => `<div class="av" style="--c:${C(BOT[k][1])}"></div>`).join('')}</div>`;
const I = (n, c = '') => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;

/* ---------- Sidebar ---------- */
function sidebar(sel) {
  const row = (id, avh, name, l2, time, right = '', cls = '') => `
    <div class="chatrow ${cls} ${sel === id ? 'sel' : ''}">${avh}
      <div class="grow"><div class="l1"><span class="ellipsis">${name}</span><span class="time">${time}</span></div>
      <div class="l2"><span class="ellipsis">${l2}</span>${right}</div></div></div>`;
  return `<aside class="sb glass-sidebar">
    <div class="sb-top"><div class="host"><span class="on"></span>Mac mini（家）${I('chevD', 's14')}</div>
      <button class="iconbtn" title="新建 ⌘N">${I('edit')}</button></div>
    <div class="sb-search">${I('search', 's14')}<span class="grow">搜索</span><span class="kbd">⌘K</span></div>
    <div class="sb-scroll">
      ${row('main', av('Z', 40), '总管 <span class="tag">主 Bot</span>', '◎ 登录功能 待你验收', '11:42', '<span class="badge">1</span>')}
      <div class="section-title" style="margin-top:8px">群 · 3</div>
      ${row('group', gav(['Z', 'P', 'C', 'T']), '登录功能', '编码：收到，改为只做邮箱登录', '10:32', '<span class="chip working"><span class="spinner"></span>1</span>')}
      ${row('g2', gav(['Z', 'R']), '竞品调研', '调研：正在整理对比表…', '10:12', '<span class="chip working"><span class="spinner"></span>1</span>')}
      ${row('g3', gav(['Z', 'B']), '换新 MacBook', '<span class="waitline">⚠ 需要你审批 · 下单 ¥14,999</span>', '09:40', '<span class="badge" style="background:var(--warning)">1</span>', 'attn')}
      <div class="navrow" style="height:28px">${I('chevR', 's14')}<span>已完成</span><span class="r">3</span></div>
      <div class="section-title" style="margin-top:8px">Bot · 5</div>
      ${[['P', '', '空闲'], ['C', 'wait', '需要你审批'], ['T', '', '待命'], ['R', 'working', '1 个活'], ['X', '', '待命']].map(([k, d, s]) =>
        `<div class="botrow" style="position:relative;${sel === 'bot' + k ? 'background:var(--bg-selected)' : ''}">${av(k, 20)}<span>${BOT[k][0]}</span><span class="st">${d === 'working' ? '<span class="spinner" style="color:var(--accent)"></span>' + s : d === 'wait' ? `<span class="chip wait">${I('alert', 's14')}${s}</span>` : '<span class="sdot" style="opacity:.5"></span>' + s}</span></div>`).join('')}
    </div>
    <div class="sb-foot">
      <div class="navrow ${sel === 'work' ? 'sel' : ''}">${I('layout')}<span>工作台</span><span class="r t3">4 进行中</span></div>
      <div class="navrow ${sel === 'dash' ? 'sel' : ''}">${I('chart')}<span>仪表盘</span></div>
      <div class="navrow ${sel === 'routines' ? 'sel' : ''}">${I('clock')}<span>定时任务</span><span class="r t3">3</span></div>
      <div class="navrow ${sel === 'skills' ? 'sel' : ''}">${I('zap')}<span>技能</span><span class="r t3">12</span></div>
      <div class="navrow ${sel === 'settings' ? 'sel' : ''}">${I('settings')}<span>设置</span><span class="r kbd">⌘,</span></div>
    </div></aside>`;
}

const composer = (ph) => `<div class="composer"><div class="center row gap8" style="width:100%">
  <div class="box"><button class="iconbtn">${I('plus', 's18')}</button><div class="txt">${ph}</div>
  <button class="iconbtn">${I('at', 's18')}</button><div class="send off">${I('send', 's18')}</div></div></div></div>`;

const panelHead = (t, back) => `<div class="panel-h glass-toolbar">${back ? `<button class="iconbtn">${I('chevL')}</button>` : ''}<span class="t">${t}</span>
  <button class="iconbtn">${I('settings')}</button><button class="iconbtn">${I('panelR')}</button></div>`;

/* ---------- Views ---------- */
const V = {};
V.main = () => sidebar('main') + `
<section class="main">
  <div class="toolbar glass-toolbar">${av('Z', 32)}<div class="grow"><div class="tt">总管</div><div class="ts">主 Bot · 只协调，不干活</div></div>
    <button class="iconbtn">${I('search')}</button><button class="iconbtn on">${I('panelR')}</button></div>
  <div class="scroll"><div class="msgs center">
    ${MB.day('今天')}
    ${MB.msg('me', ['给 App 加个邮箱登录，周六前上线'], { time: '09:58' })}
    ${MB.msg('Z', ['好的，我拉了产品、编码、测试建群。', MB.group({ members: ['Z', 'P', 'C', 'T'], title: '登录功能', created: true, note: '给 App 加邮箱登录，周六前上线' })], { time: '09:58' })}
    ${MB.msg('me', ['顺便看下今天 HN 前三是什么'], { time: '10:05' })}
    ${MB.msg('Z', [MB.handoff('R')], { time: '10:05' })}
    ${MB.msg('R', ['<p>1. <b>Zed 1.0 发布</b> — GPU UI 框架开源新版本</p><p>2. <b>SQLite 的 JSONB</b> 性能对比</p><p>3. <b>本地 LLM 推理</b> M4 基准测试</p>'], { time: '10:07', role: true })}
    ${MB.msg('Z', ['「登录功能」做完了，请你验收：', MB.review({ title: '登录功能', list: [['PRD', 'product/prd.md', 'P', 'file'], ['原型', 'product/prototype/', 'P', 'globe'], ['代码 · 已部署 localhost:3000', 'code/', 'C', 'folder'], ['测试报告 20/20', 'test/report.md', 'T', 'check']] })], { time: '11:42' })}
  </div></div>
  ${composer('给 总管 发消息…')}
</section>
<aside class="panel glass-panel">${panelHead('跟进')}
  <div class="panel-b">
    <div class="psec"><div class="ph">本对话中等你处理<span class="r badge" style="background:var(--review)">1</span></div>
      <div class="banner review">${I('target')}<span class="grow">登录功能：验收</span>${I('chevR', 's14')}</div></div>
    <div class="psec"><div class="ph">正在跟进的群<span class="r">3</span></div>
      ${[[['Z', 'P', 'C', 'T'], '登录功能', '<span class="chip review">◎ 待你验收</span>'], [['Z', 'R'], '竞品调研', '<span class="t-caption">调研 · 工作中 41 分</span>'], [['Z', 'B'], '换新 MacBook', '<span class="chip wait">⚠ 等你审批</span>']].map(([ks, n, st]) =>
        `<div class="mrow" style="height:52px">${gav(ks, 32)}<div class="grow"><div>${n}</div><div style="margin-top:2px">${st}</div></div><button class="iconbtn" title="进入群聊">${I('chevR', 's14')}</button></div>`).join('')}</div>
  </div></aside>`;

V.group = () => sidebar('group') + `
<section class="main">
  <div class="toolbar glass-toolbar">${gav(['Z', 'P', 'C', 'T'], 32)}<div class="grow"><div class="tt">登录功能</div>
    <div class="ts"><span>4 位成员</span><span class="chip working" style="height:16px"><span class="spinner"></span>进行中</span></div></div>
    <button class="iconbtn">${I('search')}</button><button class="iconbtn on">${I('panelR')}</button></div>
  <div class="statusbar">
    ${[['Z', '★ 负责人', ''], ['P', '完成', 'ok'], ['C', '工作中 25 分', 'working'], ['T', '待命', '']].map(([k, s, c]) =>
      `<button class="chip ${c}" style="height:24px;padding:0 8px 0 3px;border-radius:12px">${av(k, 18)}${BOT[k][0]} · ${c === 'working' ? '<span class="spinner"></span>' : ''}${s}</button>`).join('')}
  </div>
  <div class="pinned glass-toolbar"><span class="bar"></span><div class="grow"><div style="font-weight:600;color:var(--accent)">公告</div>
    <div class="t2 ellipsis">给 App 加邮箱登录，10/12 前上线 · 只做邮箱登录，不做手机号</div></div>${I('chevD', 's14')}</div>
  <div class="scroll"><div class="msgs center">
    ${MB.day('今天')}
    ${MB.system('总管 创建了群，拉入 产品、编码、测试')}
    ${MB.msg('Z', [`给 App 加邮箱登录，10/12 前上线。${MB.at('P')} 先出 PRD 和原型，放在 <code>Home/product/</code>。`], { time: '10:00', role: true })}
    ${MB.msg('P', ['收到，开始写 PRD 和原型。'], { time: '10:00', role: true })}
    ${MB.task({ title: 'PRD 与原型', state: 'done', time: '用时 18 分', bot: 'P' })}
    ${MB.msg('P', ['✓ 已完成 PRD 和原型：', MB.artifacts([['PRD', 'product/prd.md', 'P', 'file'], ['原型', 'product/prototype/', 'P', 'globe']]), `${MB.at('C')} 请按 PRD 实现，密码规则见 3.2 节。`], { time: '10:18', role: true })}
    ${MB.msg('C', ['收到，开始实现。'], { time: '10:19', role: true })}
    <div style="position:relative">${MB.msg('me', [`${MB.at('C')} 先只做邮箱登录，不要手机号`], { time: '10:31', delivery: '已送达 · <span style="color:var(--success)">编码 已读取 ✓</span>' })}
      <div class="hover-tools" style="top:-4px;right:8px"><button class="iconbtn">${I('smile', 's14')}</button><button class="iconbtn">${I('reply', 's14')}</button><button class="iconbtn">${I('more', 's14')}</button></div></div>
    ${MB.msg('C', [MB.quote('me', '先只做邮箱登录，不要手机号') + '收到，改为只做邮箱登录。', MB.choice({ question: `登录失败 5 次后要锁账号吗？${MB.at('me')}`, options: ['锁定 15 分钟', '不锁，只加验证码'] })], { time: '10:32', role: true })}
    ${MB.task({ title: '实现登录', state: 'working', time: '已 25 分' })}
    <div class="banner wait" style="max-width:520px;margin:6px 0 0 40px">${I('alert')}<span class="grow">编码 在私聊里等待你审批</span><button class="btn sm secondary">前往</button></div>
  </div></div>
  </div></div>
  ${composer('在 登录功能 里发消息，@ 指定 Bot…')}
</section>
<aside class="panel glass-panel">${panelHead('公告')}
  <div class="panel-b">
    <div class="psec"><div class="ph">公告<span class="r row gap6">总管 · 10:32 更新<button class="btn sm ghost">${I('edit', 's14')}编辑</button></span></div>
      <div class="card card-pad md-ann">
        <h3>登录功能</h3>
        <p>给 App 加<b>邮箱登录</b>，10/12 前上线。</p>
        <p>Home：<code>~/MacBot/projects/login/</code></p>
        <h3>当前事项</h3>
        <ul><li>只做邮箱登录，不做手机号（你 · 10:31）</li><li>密码规则：8 位以上，含字母和数字（见 PRD 3.2）</li></ul>
        <h3>已完成</h3>

function heat() { let h = ''; for (let i = 0; i < 53 * 7; i++) { const d = i % 7; const v = Math.max(0, Math.min(4, Math.round((Math.sin(i * 0.37) + 1) * 1.4 + (i / 371) * 1.6 - (d >= 5 ? 1.6 : 0) + (((i * 7919) % 13) / 13 - .5)))); h += `<i style="background:var(--heat-${v})"></i>`; } return h; }
function line(seed, c, k) { let p = ''; for (let i = 0; i <= 30; i++) { const y = 150 - (Math.sin(i * .45 + seed) * .5 + .6 + i / 60) * k; p += (i ? 'L' : 'M') + (i * 22) + ' ' + y.toFixed(1); } return `<path d="${p}" fill="none" stroke="var(--chart-${c})" stroke-width="1.75" stroke-linejoin="round"/>`; }

    <div class="row gap8"><span style="width:80px"></span><button class="btn sm secondary">拉取模型</button><button class="btn sm secondary">测试连接</button><span class="t-caption" style="color:var(--danger)">401 Unauthorized</span></div></div></div>`);
V.set_tools = () => settingsShell(4, '工具与审批', stitle('新 Bot 默认开启的工具') + card([['file', '文件（读、写、改、找）'], ['terminal', 'bash'], ['globe', '浏览器'], ['branch', '子代理'], ['link', '网页'], ['cpu', 'MCP', 0]].map(([i, t, on = 1]) => `${I(i, 't2')}<span class="grow">${t}</span>${tog(on)}`))

    <div class="row" style="height:40px;padding:0 14px;color:var(--accent)">${I('plus', 's14')} 添加规则</div></div>`);
V.set_computer = () => settingsShell(6, '电脑与浏览器', stitle('浏览器') + card([`<span class="grow">默认浏览器模式</span>${fld('无头 + 复用 Chrome', 200, 1)}`, `<span class="grow">Chrome profile</span>${fld('Default', 200, 1)}`, `<span class="grow">实时画面画质</span><div class="seg"><button class="on">自动</button><button>清晰</button><button>省流</button></div>`])

V.set_hosts = () => settingsShell(7, 'Host 连接', card([['Mac mini（家）', '192.168.31.162:7788', 'ok', '在线 · 当前'], ['MacBook（公司）', 'wss://bot.example.com', '', '离线']].map(([n, a, c, s]) => `<span class="sdot" style="color:var(--${c ? 'success' : 'text-tertiary'})"></span><div class="grow"><div>${n}</div><div class="t-caption mono">${a}</div></div><span class="t-caption">${s}</span><button class="btn sm ghost">编辑</button><button class="btn sm ghost" style="color:var(--danger)">删除</button>`))

  if (stage === 0) return { items: [q1, q2, q3], cur: 0 };
  if (stage === 1) return { items: [{ ...q1, state: 'answered', picked: [1] }, { ...q2, typing: '用 hi@app.com，已经配好 SPF' }, q3], cur: 1 };

V.reply = () => V.group()

  .replace('<div class="send off">', '<div class="send">')
  .replace(BANNER, `<div style="position:relative">${MB.msg('C', ['收到，改为只做邮箱登录。'], { time: '10:32', role: true })}<div class="hover-tools" style="top:-6px;left:300px;right:auto"><button class="iconbtn">${I('smile', 's14')}</button><button class="iconbtn on">${I('reply', 's14')}</button><button class="iconbtn">${I('more', 's14')}</button></div></div>
    ${MB.msg('me', [MB.quote('P', '密码规则：8 位以上，含字母和数字') + `${MB.at('P')} 规则里再加一条：不能和邮箱相同`], { time: '10:36', delivery: '已送达 · <span style="color:var(--success)">产品 已读取 ✓</span>' })}${BANNER}`);

V.msgmenu = () => over(V.group(), `<div class="pop glass-pop" style="position:absolute;left:330px;top:420px;width:236px">
  <div class="row" style="justify-content:space-between;padding:2px 4px 6px;font-size:18px">${['👍', '❤️', '😂', '🎉', '👀', '✅'].map((e) => `<span style="width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center">${e}</span>`).join('')}</div>
  <div class="divider" style="margin:0 0 4px"></div>
  ${[['reply', '回复', 'R', 1], ['copy', '引用', 'Q'], ['copy', '复制文字', '⌘C'], ['pin', '引用到公告'], ['monitor', '查看工作详情'], ['link', '复制消息链接']].map(([i, t, k, on]) => `<div class="item ${on ? 'on' : ''}">${I(i, 's14')}<span class="grow">${t}</span>${k ? `<span class="kbd" style="${on ? 'color:inherit;box-shadow:0 0 0 1px rgba(255,255,255,.4)' : ''}">${k}</span>` : ''}</div>`).join('')}
  </div>`).replace(BANNER, `<div style="outline:2px solid var(--accent-soft);border-radius:18px;outline-offset:2px;width:fit-content">${MB.msg('C', ['收到，改为只做邮箱登录。'], { time: '10:32', role: true })}</div>${BANNER}`);
V.quote = () => V.reply().replace(MB.replyBar('C', '收到，改为只做邮箱登录。'), MB.replyBar('C', '收到，改为只做邮箱登录。', 'quote')).replace('顺便把错误提示改成中文', `${MB.at('T')} 按这个范围补测试用例`);

V.queue = () => V.group()

  .replace(BANNER, `${MB.msg('me', ['登录页文案统一用「您」'], { time: '10:33', delivery: `总管 已收到 · <span style="color:var(--accent)">${I('clock', 's14')} 编码 交付前会看到</span>` })}${MB.msg('Z', ['好的，已记下。编码 交付前会看到这条，不打断它手头的活。'], { time: '10:33', role: true })}${BANNER}`);
V.queuepanel = () => V.detail().replace('<div class="psec"><div class="ph">工作过程</div>', `<div class="psec"><div class="ph">待看消息<span class="r badge muted" style="background:var(--text-secondary)">2</span></div>
      ${MB.queueItem('me', '登录页文案统一用「您」', '10:33')}${MB.queueItem('T', '测试那边 10 点前要，来得及吗？', '10:33')}
      <div class="t-caption" style="margin-top:8px;line-height:16px">没有 @ 编码的消息不会打断它，交付前会一起查看。点「改为插话」可以让某一条在下一步就生效。</div></div>
    <div class="psec"><div class="ph">工作过程</div>`);
V.queuedone = () => V.queue().replace(`<span style="color:var(--accent)">${I('clock', 's14')} 编码 交付前会看到</span>`, `<span style="color:var(--success)">编码 交付前已查看 ✓</span>`).replace(`工作中 25 分 <span class="qbadge">${I('clock', 's14')}2</span>`, '工作中 25 分');

// Settings → 记忆 (user memory only; 03 §6.7)
const MEMS = [
  ['回复用中文，代码和注释用英文。', 'P', '登录功能', '10/09 10:21', 3],
  ['不喜欢长篇报告：先给结论，细节放后面。', 'Z', '和总管的私聊', '10/08 21:40', 1],
  ['常用的技术栈：TypeScript、Rust；数据库偏好 SQLite。', 'C', '官网改版', '10/07 15:02', 2],
  ['周末不要推送非紧急通知。', 'me', null, '10/06 09:15', 1],
  ['截图和原型优先给移动端尺寸。', 'P', '竞品调研', '10/05 18:33', 1],
];
const memRow = ([t, k, chat, at], i, edit) => `<div class="mem-row ${edit ? 'editing' : ''}">
  ${edit ? `<div class="field area focus" style="min-height:64px;font-size:14px;line-height:20px">${t}<span style="border-left:1.5px solid var(--accent)"></span></div>
    <div class="row gap8" style="margin-top:8px"><span class="t-caption grow">${t.length} / 500 字 · ⌘↵ 保存</span><button class="btn sm secondary">取消</button><button class="btn sm primary">保存</button></div>`
  : `<div class="row gap12" style="align-items:flex-start"><div class="grow" style="font-size:14px;line-height:21px">${t}</div><div class="mem-acts"><button class="iconbtn">${I('edit', 's14')}</button><button class="iconbtn" style="color:var(--danger)">${I('x', 's14')}</button></div></div>
    <div class="row gap6 t-caption" style="margin-top:6px">${k === 'me' ? `${I('user', 's14')}你手动添加` : `${av(k, 16)}${BOT[k][0]} 记下 · <a class="mb-at">${chat}</a>`}<span>· ${at}</span></div>`}</div>`;
V.set_memory = () => settingsShell(1, '记忆', `
  <div class="t2" style="font-size:13px;line-height:20px;margin-bottom:16px">这里是<b>用户记忆</b>：所有 Bot 共享的、关于你的习惯和偏好。Bot 会在对话中自动记下，你也可以直接修改、删除或添加。修改后，所有 Bot 在下一次思考前就会知道。Bot 自己的经验和项目记忆由 Bot 管理，不在这里显示。</div>
  <div class="card" style="padding:14px 16px;margin-bottom:16px"><div class="row" style="margin-bottom:8px"><b class="grow">用量</b><span class="t-foot mono">1,186 / 1,500 字</span></div>
    <div style="height:6px;border-radius:3px;background:var(--bg-active);overflow:hidden"><div style="width:79%;height:100%;background:var(--accent)"></div></div>
    <div class="t-caption" style="margin-top:6px">接近上限时，Bot 会自己合并相近的条目；你也可以删掉不需要的。</div></div>
  <div class="row gap8" style="margin-bottom:12px"><div class="field grow">${I('search', 's14 t3')}<span class="t3">搜索记忆</span></div><button class="btn primary">${I('plus', 's14')}添加</button></div>
  <div class="card mem-list">${MEMS.map((m, i) => memRow(m, i, false)).join('')}</div>`);
V.set_memory_edit = () => V.set_memory().replace(memRow(MEMS[0], 0, false), memRow(MEMS[0], 0, true));
V.set_memory_conflict = () => V.set_memory_edit().replace('<div class="card mem-list">', `<div class="banner wait" style="margin-bottom:12px;font-size:12px">${I('alert')}<span class="grow">产品 刚刚也修改了这条记忆（版本 4）。<b>查看对方的版本</b> 后再决定保存哪一份</span></div><div class="card mem-list">`);

const LIST = [['main', '主 Bot 私聊'], ['botchat', 'Bot 私聊'], ['group', '群聊 + 公告'], ['mention', '@ 成员'], ['msgmenu', '右键消息'], ['queue', '待看消息 · 发送'], ['queuepanel', '待看消息 · 工作详情'], ['queuedone', '待看消息 · 已查看'], ['reply', '回复（右键 → 回复）'], ['quote', '引用（右键 → 引用）'], ['decide1', '决策 · 多题堆叠'], ['decide2', '决策 · 答了 1 题'], ['decide3', '决策 · 全部答完'], ['single', '决策 · 单题已答'], ['detail', '群聊 + 工作详情'], ['artifact', '产物预览'], ['trace', '全屏运行轨迹'], ['routines', '定时任务'], ['work', '工作台'], ['dash', '仪表盘'], ['skills', '技能'], ['computer', 'Agent Computer'], ['settings', '设置 · 运行与并发'], ['set_general', '设置 · 通用'], ['set_memory', '设置 · 记忆'], ['set_memory_edit', '设置 · 记忆 · 编辑'], ['set_memory_conflict', '设置 · 记忆 · 冲突'], ['set_models', '设置 · 模型与服务商'], ['set_tools', '设置 · 工具与审批'], ['set_computer', '设置 · 电脑与浏览器'], ['set_hosts', '设置 · Host'], ['set_about', '设置 · 关于'],
  ['newgroup', '新建（⌘N）'], ['search', '搜索（⌘K）'], ['onboard', '首次启动'], ['offline', '断线重连'],
  ['annedit', '编辑公告'], ['botdetail', 'Bot 详情'], ['botsettings', 'Bot 设置'], ['mainsettings', '主 Bot 设置'], ['hosts', 'Host 切换'], ['addhost', '添加 Host'], ['ctxmenu', '右键菜单'],
  ['slash', '/ 技能'], ['slash_q', '/ 技能 · 筛选'], ['slash_none', '/ 技能 · 无匹配'], ['slash_picked', '/ 技能 · 已选中'], ['attach', '+ 附件'], ['dragfile', '拖入文件'], ['changes', '提修改意见'], ['completed', '已完成的群'], ['empty', '空状态'], ['loading', '加载中'],
  ['computer2', '你正在操作'], ['dash2', '仪表盘 · 星期×小时 + 下钻'], ['skillnew', '新建技能'], ['skilldraft', '技能草稿'], ['narrow', '窄窗口']];
const screens = document.getElementById('screens'), win = document.getElementById('win');
screens.innerHTML = LIST.map(([k, t]) => `<button data-v="${k}">${t}</button>`).join('');
function show(k) {
  win.innerHTML = `<div class="lights"><span></span><span></span><span></span></div>` + V[k]();
  screens.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === k));
  location.hash = k;
  MB.mergeGroups(win);
  win.querySelectorAll('.main .scroll').forEach((e) => { e.scrollTop = e.scrollHeight; });
}
screens.onclick = (e) => e.target.dataset.v && show(e.target.dataset.v);
show(location.hash.slice(1) || 'main');
</script>
