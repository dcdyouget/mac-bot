<!doctype html>
<html lang="zh-CN" data-theme="light" data-material="translucent">
<head>
<meta charset="utf-8">
<title>Mac Bot · Android / iOS 原型</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
/* spec: 04-mobile.md — frames at 1dp/pt = 1px */
.board { display: flex; flex-direction: column; gap: 48px; align-items: center; }
.rowp { display: flex; gap: 40px; align-items: flex-start; }
.plat { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 10px 6px; }
.phone { position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-window);
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #333, 0 30px 70px rgba(0,0,0,.3); font-size: 15px; line-height: 21px; }
.phone.a { width: 412px; height: 915px; border-radius: 32px; }
.phone.i { width: 393px; height: 852px; border-radius: 55px; }
.phone .bubble { font-size: 16px; line-height: 22px; padding: 7px 12px; }
.phone .bubble .name { font-size: 14px; }
.phone .grp { width: 100%; max-width: 100%; }
.phone .grp .stack { max-width: calc(100% - 56px); }
.phone .msgs { padding: 8px 10px; }
.sbar { flex: none; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; }
.a .sbar { height: 24px; padding: 0 20px; font-size: 13px; font-weight: 500; }
.i .sbar { height: 54px; padding: 0 34px 0 44px; font-size: 17px; }
.i .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 19px; background: #000; z-index: 9; }
.a .cam { position: absolute; top: 8px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #000; z-index: 9; }
/* Android top app bar 64 */
.tab64 { height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px; }
.tab64 .t { font-size: 22px; line-height: 28px; font-weight: 500; flex: 1; }
.abtn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; color: var(--text-secondary); }
/* iOS nav 44 + large title 52 */
.nav44 { height: 44px; flex: none; display: flex; align-items: center; padding: 0 8px; gap: 4px; position: relative; }
.nav44 .ct { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 600; pointer-events: none; }
.nav44 .back { color: var(--accent); display: flex; align-items: center; font-size: 17px; gap: 2px; }
.ibtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--accent); }
.lt { height: 52px; flex: none; padding: 0 16px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -.5px; }
.content { flex: 1; overflow: hidden; position: relative; background: var(--bg-window); }
.content.chat { background: var(--bg-chat); }
/* list rows 72 */
.lrow { display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 16px; position: relative; }
.lrow .bd { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
.i .lrow .bd { border-bottom: .5px solid var(--border-default); }
.lrow .l1 { display: flex; gap: 6px; font-size: 16px; font-weight: 600; line-height: 21px; align-items: center; }
.lrow .l1 .tm { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--text-tertiary); }
.lrow .l2 { display: flex; gap: 6px; font-size: 14px; line-height: 19px; color: var(--text-secondary); margin-top: 2px; align-items: center; }
.lrow .l2 .ellipsis { flex: 1; }
.shead { height: 32px; display: flex; align-items: flex-end; padding: 0 16px 6px; font-size: 13px; font-weight: 600; color: var(--text-tertiary); }
/* bottom nav */
.anav { height: 80px; flex: none; display: flex; background: var(--bg-sidebar); border-top: 1px solid var(--border-subtle); }
.anav div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.anav .pill { width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.anav .on { color: var(--text-primary); } .anav .on .pill { background: var(--accent-soft); color: var(--accent); }
.gbar { height: 24px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--bg-sidebar); }
.gbar span { width: 108px; height: 4px; border-radius: 2px; background: var(--text-primary); opacity: .4; }
.inav { height: 83px; flex: none; display: flex; padding-bottom: 34px; background: var(--bg-sidebar); border-top: .5px solid var(--border-default); position: relative; }
.inav div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--text-tertiary); }
.inav .on { color: var(--accent); }
.home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--text-primary); z-index: 9; }
[data-material='translucent'] .inav, [data-material='translucent'] .anav, [data-material='translucent'] .gbar { backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); }
.mcomp { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px; background: var(--bg-sidebar); border-top: .5px solid var(--border-default); }
.mcomp .box { flex: 1; min-height: 40px; border-radius: 20px; background: var(--bg-input); box-shadow: 0 0 0 1px var(--border-default); padding: 9px 14px; font-size: 16px; line-height: 22px; color: var(--text-tertiary); }
.mcomp .rb { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); flex: none; }
.mcomp .rb.send { background: var(--accent); color: var(--accent-on); }
.fab { position: absolute; right: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-on); display: flex; align-items: center; justify-content: center; box-shadow: var(--elevation-3); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-elevated); border-radius: 20px 20px 0 0; box-shadow: var(--elevation-4); padding: 8px 16px 24px; z-index: 5; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 0 auto 14px; }
.scrim { position: absolute; inset: 0; background: var(--bg-overlay); z-index: 4; }
.mbtn { height: 48px; border-radius: 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.i .mbtn { height: 50px; border-radius: 14px; }
.stat2 { padding: 12px 14px; } .stat2 .v { font-size: 22px; font-weight: 600; letter-spacing: -.3px; }
.notif { margin: 8px; border-radius: 22px; padding: 12px 14px; background: var(--bg-elevated); box-shadow: var(--elevation-3); font-size: 14px; line-height: 19px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); gap: 3px; }
.heat i { width: 10px; height: 10px; border-radius: 2px; display: block; }
</style>
</head>
<body>
<div class="wallpaper"><div class="board" id="board"></div></div>
<script src="shared.js"></script>
<script src="blocks.js"></script>
<script>
const C = (i) => `var(--avatar-${i})`;
const BOT = { Z: ['总管', 0], P: ['产品', 1], C: ['编码', 2], T: ['测试', 3], R: ['调研', 4], X: ['X 侦察', 5], B: ['比价', 6] };
const av = (k, s = 32, ring) => `<div class="av s${s}" style="--c:${C(BOT[k][1])}">${k === 'Z' ? GLASSES : ''}${ring ? '<span class="ring-working"></span>' : ''}</div>`;
const gav = (ks, s = 48) => `<div class="gav s${s} n${Math.min(ks.length, 4)}">${ks.map((k) => `<div class="av" style="--c:${C(BOT[k][1])}"></div>`).join('')}</div>`;
const I = (n, c = '') => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;

const sbar = (p) => p === 'a' ? `<div class="cam"></div><div class="sbar"><span>9:41</span><span class="row gap4">${I('bell', 's14')}▾ ▮</span></div>` : `<div class="island"></div><div class="sbar"><span>9:41</span><span>􀙇 ▮</span></div>`;
const tabs = (p, on) => {
  const items = [['message', '消息'], ['layout', '工作台'], ['user', '我的']];
  return p === 'a'
    ? `<div class="anav glass">${items.map(([i, t], k) => `<div class="${k === on ? 'on' : ''}"><span class="pill">${I(i, 's24')}</span>${t}</div>`).join('')}</div><div class="gbar"><span></span></div>`
    : `<div class="inav">${items.map(([i, t], k) => `<div class="${k === on ? 'on' : ''}">${I(i, 's24')}${t}</div>`).join('')}</div><div class="home"></div>`;
};
const header = (p, title, opts = {}) => p === 'a'
  ? `<div class="tab64">${opts.back ? `<span class="abtn" style="margin-left:-12px">${I('chevL', 's24')}</span>` : ''}${opts.lead || ''}<span class="t" style="${opts.small ? 'font-size:18px;line-height:24px' : ''}">${title}${opts.sub ? `<div style="font-size:13px;line-height:16px;font-weight:400;color:var(--text-secondary)">${opts.sub}</div>` : ''}</span>${(opts.actions || []).map((a) => `<span class="abtn">${I(a, 's24')}</span>`).join('')}</div>`
  : opts.large
    ? `<div class="nav44"><span style="flex:1"></span>${(opts.actions || []).map((a) => `<span class="ibtn">${I(a, 's24')}</span>`).join('')}</div><div class="lt">${title}</div>`
    : `<div class="nav44">${opts.back ? `<span class="back">${I('chevL', 's24')}${opts.backLabel || ''}</span>` : ''}<div class="ct">${opts.lead ? `<div class="row gap6" style="justify-content:center">${title}</div>` : title}${opts.sub ? `<div style="font-size:12px;line-height:14px;font-weight:400;color:var(--text-secondary)">${opts.sub}</div>` : ''}</div><span style="flex:1"></span>${(opts.actions || []).map((a) => `<span class="ibtn">${I(a, 's24')}</span>`).join('')}</div>`;
const comp = (p, ph) => `<div class="mcomp"><span class="rb">${I('plus', 's24')}</span><div class="box">${ph}</div><span class="rb">${I('at', 's24')}</span></div>${p === 'i' ? '<div style="height:34px;background:var(--bg-sidebar);flex:none"></div><div class="home"></div>' : '<div class="gbar"><span></span></div>'}`;

const S = {};
S.list = (p) => sbar(p) + header(p, p === 'a' ? `<span class="row gap6"><span class="sdot" style="color:var(--success)"></span>Mac mini（家）${I('chevD', 's18')}</span>` : '消息', { large: 1, actions: ['search', 'edit'] }) +
  (p === 'i' ? `<div class="row gap6 t-foot" style="padding:0 16px 8px"><span class="sdot" style="color:var(--success)"></span>Mac mini（家）${I('chevD', 's14')}</div>` : '') + `
  <div class="content">
    <div class="lrow" style="background:var(--bg-selected)">${av('Z', p === 'a' ? 48 : 52)}<div class="bd"><div class="l1">总管<span class="t3" style="font-weight:400;font-size:13px">主 Bot</span><span class="tm">11:42</span></div><div class="l2"><span class="ellipsis" style="color:var(--review)">◎ 登录功能 待你验收</span><span class="badge">1</span></div></div></div>
    <div class="shead">群</div>
    ${[[['Z', 'P', 'C', 'T'], '登录功能', '编码：收到，改为只做邮箱登录', '10:32', '<span class="chip working"><span class="spinner"></span>1</span>'], [['Z', 'R'], '竞品调研', '调研：正在整理对比表…', '10:12', '<span class="chip working"><span class="spinner"></span>1</span>'], [['Z', 'B'], '换新 MacBook', '<span class="waitline">⚠ 需要你审批 · 下单</span>', '09:40', '<span class="badge" style="background:var(--warning)">1</span>']].map(([ks, n, m, t, r]) =>
      `<div class="lrow">${gav(ks, p === 'a' ? 48 : 52)}<div class="bd"><div class="l1">${n}<span class="tm">${t}</span></div><div class="l2"><span class="ellipsis">${m}</span>${r}</div></div></div>`).join('')}
    <div class="lrow" style="height:44px"><span class="t2" style="font-size:15px">已完成 3</span><span style="margin-left:auto" class="t3">${I('chevR')}</span></div>
    <div class="shead">Bot</div>
    ${[['P', '○ 空闲'], ['C', '<span class="chip wait">⚠ 需要你审批</span>'], ['T', '○ 待命']].map(([k, s]) => `<div class="lrow" style="height:56px">${av(k, 40)}<div class="bd"><div class="l1" style="font-weight:500">${BOT[k][0]}<span class="tm">${s}</span></div></div></div>`).join('')}
    ${p === 'a' ? `<div class="fab">${I('edit', 's24')}</div>` : ''}
  </div>` + tabs(p, 0);

S.group = (p) => sbar(p) + header(p, `${p === 'i' ? gav(['Z', 'P', 'C', 'T'], 24) : ''}登录功能`, { back: 1, backLabel: '消息', lead: p === 'i' ? 1 : 0, small: 1, sub: '进行中 · 4 位成员', actions: ['panelR'] }).replace('<span class="t"', p === 'a' ? `${gav(['Z', 'P', 'C', 'T'], 40)}<span style="width:12px"></span><span class="t"` : '<span class="t"') + `
  <div class="row gap6" style="padding:6px 12px;overflow:hidden;flex:none;border-bottom:1px solid var(--border-subtle)">
    ${[['Z', '★', ''], ['P', '✓', 'ok'], ['C', '工作中', 'working'], ['T', '待命', '']].map(([k, s, c]) => `<span class="chip ${c}" style="height:26px;padding:0 9px 0 3px;border-radius:13px;font-size:12px">${av(k, 20)}${BOT[k][0]} ${c === 'working' ? '<span class="spinner"></span>' : ''}${s}</span>`).join('')}</div>
  <div class="row gap8" style="height:44px;padding:0 12px;flex:none;border-bottom:1px solid var(--border-subtle);font-size:13px"><span style="width:2px;height:28px;border-radius:1px;background:var(--accent)"></span><div class="grow"><div style="color:var(--accent);font-weight:600;line-height:17px">公告</div><div class="ellipsis t2" style="line-height:17px">给 App 加邮箱登录，10/12 前上线 · 只做邮箱登录</div></div>${I('chevR', 's18 t3')}</div>
  <div class="content chat"><div class="msgs">
    ${MB.msg('P', ['✓ 已完成 PRD 和原型：', MB.artifacts([['PRD', 'product/prd.md', 'P', 'file']]), `${MB.at('C')} 请按 PRD 实现`], { time: '10:18' })}
    ${MB.msg('me', [`${MB.at('C')} 只做邮箱登录`], { time: '10:31', delivery: '已送达 · <span style="color:var(--success)">编码 已读取 ✓</span>' })}
    ${MB.msg('C', [MB.quote('me', '只做邮箱登录') + '收到，正在调整。', MB.choice({ question: `登录失败 5 次后要锁账号吗？${MB.at('me')}`, options: ['锁定 15 分钟', '不锁，只加验证码'] })], { time: '10:32' })}
    ${MB.task({ title: '实现登录', state: 'working', time: '25 分' })}
  </div></div>` + comp(p, '发消息，@ 指定 Bot');

S.mainchat = (p) => sbar(p) + header(p, `${p === 'i' ? av('Z', 24) : ''}总管`, { back: 1, backLabel: '消息', lead: p === 'i' ? 1 : 0, small: 1, sub: '主 Bot · 只协调，不干活', actions: ['panelR'] }).replace('<span class="t"', p === 'a' ? `${av('Z', 40)}<span style="width:12px"></span><span class="t"` : '<span class="t"') + `
  ${pinbar('review', 'target', '等你处理 1', '登录功能：验收')}
  <div class="content chat"><div class="msgs">
    ${MB.msg('me', ['给 App 加个邮箱登录，周六前上线'], { time: '09:58', tapback: [['👍', 1]] })}
    ${MB.msg('Z', ['好的，我拉了产品、编码、测试建群。', MB.group({ members: ['Z', 'P', 'C', 'T'], title: '登录功能', created: true, note: '给 App 加邮箱登录，周六前上线' })], { time: '09:58' })}
    ${MB.msg('Z', ['「登录功能」做完了，请你验收：', MB.review({ title: '登录功能', list: [['PRD', 'product/prd.md', 'P', 'file'], ['代码', 'code/', 'C', 'folder']] })], { time: '11:42' })}
  </div></div>` + comp(p, '给 总管 发消息');

S.botchat = (p) => sbar(p) + header(p, `${p === 'i' ? av('C', 24) : ''}编码`, { back: 1, backLabel: '消息', lead: p === 'i' ? 1 : 0, small: 1, sub: '写代码、部署 · 工作中 2 个活', actions: ['monitor', 'panelR'] }).replace('<span class="t"', p === 'a' ? `${av('C', 40)}<span style="width:12px"></span><span class="t"` : '<span class="t"') + `
  ${pinbar('warning', 'shield', '待审批 1', 'bash · git push · 登录功能')}
  <div class="content chat"><div class="msgs">
    ${MB.msg('me', ['登录功能那边进展怎么样？'], { time: '10:40' })}
    ${MB.msg('C', ['已实现完，18 个测试通过，正在部署。', MB.group({ members: ['Z', 'P', 'C', 'T'], title: '登录功能', status: 'working', note: '我负责「实现登录」· 已 25 分' })], { time: '10:40', name: false })}
    ${MB.msg('C', ['推送需要你确认：', MB.approval({ tool: 'bash', command: 'git push origin feature/email-login', from: '来自 登录功能', rule: 'git push 先问我' })], { time: '11:43', name: false })}
  </div></div>` + comp(p, '给 编码 发消息');

S.work = (p) => sbar(p) + header(p, '工作台', { large: 1, actions: ['search'] }) + `
  <div class="content" style="padding:0 16px">
    <div class="row" style="margin:${p === 'a' ? '0' : '0'} 0 12px"><div class="seg" style="width:100%"><button class="on" style="flex:1;height:30px;font-size:13px">按 Bot</button><button style="flex:1;font-size:13px">按群</button><button style="flex:1;font-size:13px">按状态</button></div></div>
    <div class="banner review" style="margin-bottom:8px;font-size:14px">${I('target', 's18')}<span class="grow">登录功能 等你验收</span><span class="btn sm primary">去验收</span></div>
    <div class="banner wait" style="margin-bottom:16px;font-size:14px">${I('alert', 's18')}<span class="grow">比价 · 审批下单</span><span class="btn sm warn">去处理</span></div>
    <div class="t-foot" style="margin-bottom:6px">运行中 5 / 8</div>
    ${[['C', '2/3', [['登录功能 · 实现登录', '25 分 · 88k'], ['官网改版 · 首页重构', '9 分 · 31k']]], ['R', '1/2', [['竞品调研 · 对比表', '41 分 · 140k']]]].map(([k, c, ts]) => `
      <div class="card" style="margin-bottom:12px"><div class="row gap8" style="height:48px;padding:0 14px">${av(k, 28, 1)}<b style="font-size:16px">${BOT[k][0]}</b><span class="chip working" style="margin-left:auto">${c}</span></div>
      ${ts.map(([t, m]) => `<div class="row gap10" style="gap:10px;height:56px;padding:0 14px;border-top:1px solid var(--border-subtle)"><span class="spinner" style="color:var(--accent)"></span><div class="grow"><div style="font-size:15px">${t}</div><div class="t-foot">${m}</div></div><span class="mb-btn secondary" style="height:32px;font-size:13px;padding:0 10px">${I('message', 's14')}群聊</span>${I('chevR', 't3')}</div>`).join('')}</div>`).join('')}
    <div class="row gap8 t-foot">${av('P', 24)}产品 空闲 · ${av('T', 24)}测试 待命</div>
  </div>` + tabs(p, 1);

S.me = (p) => sbar(p) + header(p, '我的', { large: 1 }) + `
  <div class="content" style="padding:0 16px">
    <div class="card row gap12" style="padding:14px 16px;margin-bottom:20px"><span class="iconbtn" style="width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent)">${I('monitor', 's24')}</span><div class="grow"><b style="font-size:16px">Mac mini（家）</b><div class="t-foot"><span style="color:var(--success)">● 在线</span> · 192.168.31.162:7788</div></div>${I('chevR', 't3')}</div>
    <div class="card" style="margin-bottom:20px">${[['clock', '定时任务', '3'], ['user', '记忆', '1,186 / 1,500 字'], ['chart', '仪表盘', '今天 512k tok'], ['bot', 'Bot 管理', '5'], ['zap', '技能', '12']].map(([i, t, r], k) =>
      `<div class="row gap12" style="height:${p === 'a' ? 56 : 48}px;padding:0 14px;${k ? 'border-top:1px solid var(--border-subtle)' : ''}">${I(i, 's20 t2')}<span class="grow" style="font-size:16px">${t}</span><span class="t3" style="font-size:14px">${r}</span>${I('chevR', 't3')}</div>`).join('')}</div>
    <div class="card">${[['sun', '外观', '跟随系统'], ['bell', '通知', '需要你 · 待验收'], ['settings', '关于', 'v0.1.0']].map(([i, t, r], k) =>
      `<div class="row gap12" style="height:${p === 'a' ? 56 : 48}px;padding:0 14px;${k ? 'border-top:1px solid var(--border-subtle)' : ''}">${I(i, 's20 t2')}<span class="grow" style="font-size:16px">${t}</span><span class="t3" style="font-size:14px">${r}</span>${I('chevR', 't3')}</div>`).join('')}</div>
  </div>` + tabs(p, 2);

S.trace = (p) => sbar(p) + header(p, '实现登录', { back: 1, backLabel: '群', small: 1, sub: '编码 · 工作中 25 分 · 88k', actions: ['monitor'] }) + `

S.queue = (p) => S.group(p).replace("${BOT[k][0]} ", "${BOT[k][0]} ")
  .replace(/<div class="content chat"><div class="msgs">[\s\S]*?<\/div><\/div><div class="mcomp">/, `<div class="content chat"><div class="msgs">${MB.msg('C', ['收到，改为只做邮箱登录。'], { time: '10:32' })}${MB.task({ title: '实现登录', state: 'working', time: '25 分' })}${MB.msg('me', ['登录页文案统一用「您」'], { time: '10:33', delivery: `<span style="color:var(--accent)">编码 交付前会看到</span>` })}</div></div>${MB.queueHint(['C'])}<div class="mcomp">`)
  .replace('<div class="box">发消息，@ 指定 Bot</div>', '<div class="box" style="color:var(--text-primary)">测试那边 10 点前要<span style="border-left:1.5px solid var(--accent);margin-left:1px"></span></div>')
  .replace('编码 <span class="spinner"></span>工作中', `编码 <span class="spinner"></span>工作中 <span class="qbadge">2</span>`);
