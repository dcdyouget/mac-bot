ntent:flex-end;gap:8px;border-top:1px solid var(--border-subtle)}.log-heading{justify-content:space-between;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.log-controls{display:flex;align-items:center;gap:8px}.segmented{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--bg-active)}.segmented button{min-height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--text-secondary);font-size:12px}.segmented button[aria-pressed=true]{background:var(--bg-elevated);color:var(--text-primary);box-shadow:var(--elevation-1),0 0 0 .5px var(--border-subtle)}.live-toggle{min-height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--border-default);border-radius:7px;background:var(--bg-elevated);font-size:12px}.live-toggle .status-dot{width:6px;height:6px}.log-window{height:260px;min-height:140px;resize:vertical;overflow:auto;padding:14px 18px;border-radius:0 0 12px 12px;background:#141416;color:#C9C9CC;font:12px/20px var(--font-family-mono);white-space:pre-wrap;overflow-wrap:anywhere}.log-line{min-height:20px}.log-time{color:#66666B}.log-warn{color:#DDAA5C}.log-error{color:#E08470}.empty-logs{color:#9A9AA0}

<main id="setup-view" class="setup-screen hidden" aria-labelledby="setup-title"><section class="setup-card"><div class="logo large" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="14" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="11" r="1.2" fill="currentColor"/><circle cx="15.5" cy="11" r="1.2" fill="currentColor"/><path d="M9 15h6M12 1.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><h1 id="setup-title" class="setup-title" data-i18n="admin.setup.title"></h1><p class="setup-desc" data-i18n="admin.setup.desc"></p><form id="setup-form" autocomplete="off" novalidate><div class="setup-field"><label class="label" for="setup-password" data-i18n="admin.setup.password"></label><input class="field large" id="setup-password" type="password" autocomplete="off" required></div><div class="setup-field"><label class="label" for="setup-confirm" data-i18n="admin.setup.confirm"></label><input class="field large" id="setup-confirm" type="password" autocomplete="off" required aria-describedby="setup-error"></div><div class="strength" aria-live="polite"><span class="strength-bar" id="strength-1"></span><span class="strength-bar" id="strength-2"></span><span class="strength-bar" id="strength-3"></span><span class="strength-bar" id="strength-4"></span><span class="strength-label" id="strength-label"></span></div><div id="setup-error" class="field-error" role="alert"></div><button class="primary" type="submit" style="width:100%;min-height:36px" data-i18n="common.done"></button></form><div class="hint"><span data-i18n="admin.setup.hint"></span><br><code id="setup-address">—</code> + <span data-i18n="admin.setup.password_suffix"></span></div></section></main>
<main id="login-view" class="setup-screen hidden" aria-labelledby="login-title"><section class="setup-card"><div class="logo large" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="14" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="11" r="1.2" fill="currentColor"/><circle cx="15.5" cy="11" r="1.2" fill="currentColor"/><path d="M9 15h6M12 1.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><h1 id="login-title" class="setup-title" data-i18n="admin.login.title"></h1><p class="setup-desc" id="login-message" data-i18n="admin.login.desc"></p><form id="login-form" autocomplete="off" novalidate><div class="setup-field"><label class="label" for="login-password" data-i18n="admin.setup.password"></label><input class="field large" id="login-password" type="password" autocomplete="off" required aria-describedby="login-error"></div><div id="login-error" class="field-error" role="alert"></div><button class="primary" type="submit" style="width:100%;min-height:36px" data-i18n="admin.login.submit"></button></form></section></main>
<div id="admin-view" class="hidden"><header class="topbar"><div class="topbar-inner"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="14" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="11" r="1.2" fill="currentColor"/><circle cx="15.5" cy="11" r="1.2" fill="currentColor"/><path d="M9 15h6M12 1.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><strong class="brand" data-i18n="admin.title"></strong><span class="host-label">· <span id="header-host">—</span></span><span id="version-chip" class="version-chip">—</span><span class="spacer"></span><button id="theme-toggle" class="ghost" type="button" data-i18n-aria="admin.theme.toggle_aria"></button><button id="logout-button" class="ghost" type="button" data-i18n="admin.auth.help"></button></div></header>
<main class="content"><div id="global-error" class="page-error hidden" role="alert"></div>
<section class="metrics" data-i18n-aria="admin.metrics.aria"><article class="metric"><div class="metric-label" data-i18n="admin.kpi.status"></div><div id="metric-status" class="metric-value"><span class="status-dot"></span><span>—</span></div><div id="metric-uptime" class="metric-note">—</div></article><article class="metric"><div class="metric-label" data-i18n="admin.kpi.clients"></div><div id="metric-clients" class="metric-value">—</div><div class="metric-note" data-i18n="admin.kpi.clients_note"></div></article><article class="metric"><div class="metric-label" data-i18n="admin.kpi.bots"></div><div id="metric-bots" class="metric-value">—</div><div id="metric-bots-note" class="metric-note">—</div></article><article class="metric"><div class="metric-label" data-i18n="admin.kpi.browser"></div><div id="metric-browser" class="metric-value">—</div><div id="metric-browser-note" class="metric-note">—</div></article></section>

<section class="panel" aria-labelledby="logs-heading"><div class="panel-heading log-heading"><h2 id="logs-heading" data-i18n="admin.logs"></h2><div class="log-controls"><div class="segmented" role="group" data-i18n-aria="admin.logs.filter_aria"><button type="button" data-log-filter="all" aria-pressed="true" data-i18n="common.all"></button><button type="button" data-log-filter="warn" aria-pressed="false" data-i18n="admin.logs.warn"></button><button type="button" data-log-filter="error" aria-pressed="false" data-i18n="admin.logs.error"></button></div><button id="live-toggle" class="live-toggle" type="button" aria-pressed="true"><span class="status-dot"></span><span data-i18n="admin.logs.live"></span></button></div></div><div id="log-window" class="log-window" role="log" aria-live="off" tabindex="0"></div></section></main></div>
<div id="confirm-port" class="modal-backdrop hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-port-title" aria-describedby="confirm-port-copy"><h2 id="confirm-port-title" data-i18n="admin.port_dialog.title"></h2><p id="confirm-port-copy"></p><div class="actions"><button class="secondary" type="button" data-modal-cancel="confirm-port" data-i18n="common.cancel"></button><button id="confirm-port-save" class="primary" type="button" data-i18n="admin.save_restart"></button></div></section></div>
<div id="password-modal" class="modal-backdrop hidden"><section class="modal password-dialog" role="dialog" aria-modal="true" aria-labelledby="password-title"><h2 id="password-title" data-i18n="admin.change_password"></h2><form id="password-form" autocomplete="off" novalidate><label class="label" for="current-password" data-i18n="admin.password.current"></label><input id="current-password" class="field" type="password" autocomplete="off" required><label class="label" for="new-password" data-i18n="admin.password.new"></label><input id="new-password" class="field" type="password" autocomplete="off" required><label class="label" for="new-password-confirm" data-i18n="admin.setup.confirm"></label><input id="new-password-confirm" class="field" type="password" autocomplete="off" required aria-describedby="password-error"><div id="password-error" class="field-error" role="alert"></div><div class="actions"><button class="secondary" type="button" data-modal-cancel="password-modal" data-i18n="common.cancel"></button><button class="primary" type="submit" data-i18n="common.save"></button></div></form></section></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

const t=(key,values={})=>(copy[key]||key).replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??"—"));document.querySelectorAll("[data-i18n]").forEach(node=>node.textContent=t(node.dataset.i18n));document.querySelectorAll("[data-i18n-aria]").forEach(node=>node.setAttribute("aria-label",t(node.dataset.i18nAria)));document.title=t("admin.title");
const $=id=>document.getElementById(id);let currentStatus=null,logOffset=0,logEntries=[],logFilter="all",liveLogs=true,restarting=false,wasRestarting=false,restartDisconnected=false,restartUptime=null,pollTimer=null,toastTimer=null,refreshInFlight=false,restartPollInFlight=false;const prefersDark=matchMedia("(prefers-color-scheme: dark)"),savedTheme=localStorage.getItem("macbot-admin-theme");document.documentElement.dataset.theme=savedTheme||(prefersDark.matches?"dark":"light");if(savedTheme)document.documentElement.dataset.themeChoice="saved";
function toast(message){$("toast").textContent=message;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),3200)}function error(message){$("global-error").textContent=message;$("global-error").classList.remove("hidden")}function clearError(){$("global-error").classList.add("hidden")}function duration(seconds){if(!Number.isFinite(seconds)||seconds<0)return"—";const days=Math.floor(seconds/86400),hours=Math.floor(seconds%86400/3600),minutes=Math.floor(seconds%3600/60);return days?t("admin.duration.days_hours",{days,hours}):hours?t("admin.duration.hours_minutes",{hours,minutes}):t("admin.duration.minutes",{minutes})}
async function request(url,options={}){const response=await fetch(url,{credentials:"same-origin",cache:"no-store",...options});if(!response.ok){let detail=String(response.status),code="";try{const body=await response.json();detail=body.message||body.error||detail;code=body.error||""}catch(_){}const failure=Error(response.status===401?t("admin.error.unauthorized"):detail);failure.status=response.status;failure.code=code;throw failure}return response}
const renderAdminStatus=statusView;
function portManaged(status=currentStatus){return ["config","environment","command_line"].includes(status?.port_source)}
function hostNameManaged(status=currentStatus){return status?.host_name_source==="config"}
statusView=function(x){renderAdminStatus(x);$("port").disabled=portManaged(x);$("port-hint").textContent=portManaged(x)?t(`admin.port_source.${x.port_source}`,{path:x.config_path}):t("admin.port_restart_hint");$("host-name").disabled=hostNameManaged(x);$("host-name-hint").textContent=hostNameManaged(x)?t("admin.host_name_source.config",{path:x.config_path}):"";$("host-name-hint").hidden=!hostNameManaged(x)}
function statusView(x){currentStatus=x;const serverBusy=x.restarting===true||x.running!==true;if(wasRestarting&&(restartDisconnected||(Number.isFinite(restartUptime)&&Number(x.uptime_seconds)<restartUptime))){restarting=false;wasRestarting=false;restartDisconnected=false;toast(t("admin.restart.done"))}const busy=restarting||serverBusy;$("metric-status").innerHTML=busy?'<span class="spin" aria-hidden="true"></span><span></span>':'<span class="status-dot" aria-hidden="true"></span><span></span>';$("metric-status").lastElementChild.textContent=t(busy?"admin.kpi.restarting":"admin.kpi.running");$("metric-uptime").textContent=t("admin.kpi.uptime",{duration:duration(x.uptime_seconds)});$("metric-clients").textContent=x.clients_online==null?"—":x.clients_online;$("metric-bots").textContent=x.bot_count==null?"—":x.bot_count;$("metric-bots-note").textContent=x.bots_running==null||x.bots_waiting==null?t("admin.kpi.unavailable"):t("admin.kpi.bots_note",{running:x.bots_running,waiting:x.bots_waiting});$("metric-browser").textContent=x.browser_sessions==null?"—":t("admin.kpi.browser_sessions",{count:x.browser_sessions});$("metric-browser-note").textContent=x.browser_version?t("admin.kpi.browser_version",{version:x.browser_version}):t("admin.kpi.unavailable");$("header-host").textContent=x.host_name||"—";$("version-chip").textContent=x.server_version?`v${x.server_version}`:"—";$("node-id").textContent=x.node_id||"—";if(document.activeElement!==$("host-name"))$("host-name").value=x.host_name||"";if(document.activeElement!==$("port"))$("port").value=x.port||"";if(busy)wasRestarting=true;$("restart-button").disabled=busy;$("save-button").disabled=busy}
function showLogin(message=t("admin.login.desc")){clearInterval(pollTimer);pollTimer=null;$("setup-view").classList.add("hidden");$("admin-view").classList.add("hidden");$("login-view").classList.remove("hidden");$("login-message").textContent=message;$("login-error").textContent="";$("login-password").value="";$("login-password").focus()}function showSetup(x){clearInterval(pollTimer);pollTimer=null;$("login-view").classList.add("hidden");$("admin-view").classList.add("hidden");$("setup-view").classList.remove("hidden");$("setup-address").textContent=`${location.hostname||"localhost"}:${x.port||28789}`}async function loadStatus(){const x=await(await request("/admin/status")).json();if(x.setup_required){showSetup(x);return}$("setup-view").classList.add("hidden");$("login-view").classList.add("hidden");$("admin-view").classList.remove("hidden");clearError();statusView(x);startPolling()}function classify(line){const u=line.toUpperCase(),level=/\b(ERROR|FATAL|PANIC)\b/.test(u)?"error":/\b(WARN|WARNING)\b/.test(u)?"warn":"info",time=line.match(/^(\S+(?:\s+\S+)?)\s+/)?.[1]||"";return{text:line,level,time}}
function renderLogs(){const rows=logEntries.filter(x=>logFilter==="all"||(logFilter==="warn"?x.level==="warn"||x.level==="error":x.level==="error")),root=$("log-window"),bottom=root.scrollHeight-root.scrollTop-root.clientHeight<32;root.replaceChildren();if(!rows.length){const empty=document.createElement("div");empty.className="empty-logs";empty.textContent=t("admin.logs.empty");root.append(empty);return}for(const item of rows){const line=document.createElement("div");line.className=`log-line${item.level==="warn"?" log-warn":item.level==="error"?" log-error":""}`;if(item.time){const time=document.createElement("span");time.className="log-time";time.textContent=item.time;line.append(time,document.createTextNode(item.text.slice(item.time.length)))}else line.textContent=item.text;root.append(line)}if(bottom)root.scrollTop=root.scrollHeight}
async function loadLogs(initial=false){const response=await request(initial?"/admin/logs?limit=200":`/admin/logs?after=${logOffset}`),text=await response.text(),offset=Number(response.headers.get("X-Log-Offset"));if(Number.isFinite(offset))logOffset=offset;if(initial)logEntries=[];if(text)logEntries.push(...text.replace(/\n$/," ").trimEnd().split("\n").map(classify));if(logEntries.length>1000)logEntries.splice(0,logEntries.length-1000);renderLogs()}
function startPolling(){if(!$("admin-view").classList.contains("hidden")&&pollTimer===null)pollTimer=setInterval(refresh,1000)}async function refresh(){if(refreshInFlight)return;refreshInFlight=true;try{await loadStatus();if(!$("admin-view").classList.contains("hidden")&&liveLogs)await loadLogs(logOffset===0)}catch(e){if(e.status===401){clearInterval(pollTimer);pollTimer=null;showLogin(e.code==="setup_local_only"?t("admin.login.setup_local"):t("admin.login.expired"));if(restarting){restarting=false;wasRestarting=false}return}if(restarting)restartDisconnected=true;else error(e.message)}finally{refreshInFlight=false}}async function restart(){const result=await(await request("/admin/restart",{method:"POST"})).json();if(!result.ok)throw Error(result.message||t("admin.restart.failed"));restarting=wasRestarting=true;restartDisconnected=false;restartUptime=Number(currentStatus?.uptime_seconds);toast(t("admin.restart.requested"));clearInterval(pollTimer);pollTimer=null;let tries=0;pollTimer=setInterval(async()=>{if(restartPollInFlight)return;restartPollInFlight=true;tries++;try{await loadStatus();if(!restarting){clearInterval(pollTimer);pollTimer=null;startPolling()}}catch(e){if(e.status===401){clearInterval(pollTimer);pollTimer=null;restarting=false;wasRestarting=false;showLogin(t("admin.login.expired"))}else if(tries>=30){clearInterval(pollTimer);pollTimer=null;startPolling();error(t("admin.error.request",{error:t("admin.error.not_ready")}))}}finally{restartPollInFlight=false}},1000)}
async function saveSettings(){const port=Number($("port").value),name=$("host-name").value.trim();if(!hostNameManaged()&&!name){error(t("admin.error.host_name"));return}if(!Number.isInteger(port)||port<1||port>65535){error(t("admin.error.port"));return}try{clearError();const result=await(await request("/admin/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({host_name:name,...(port!==Number(currentStatus?.port)?{port}:{})})})).json();if(result.restart_required)await restart();else{await loadStatus();toast(t("admin.saved"))}}catch(e){error(t("admin.port_dialog.error",{error:e.message}))}}
function strength(pass){if(!pass)return 0;let n=pass.length>=8?1:0;if(pass.length>=12)n++;if(/[A-Z]/.test(pass)&&/[a-z]/.test(pass))n++;if(/\d|[^A-Za-z0-9]/.test(pass))n++;return Math.min(4,Math.max(1,n))}function strengthView(){const n=strength($("setup-password").value),kind=n>=4?"strong":n>=2?"medium":"weak";for(let i=1;i<=4;i++)$(`strength-${i}`).className=`strength-bar${i<=n?` active ${kind}`:""}`;$("strength-label").textContent=t("admin.setup.strength",{level:t(`admin.setup.level.${kind}`)})}
function validateSetupMatch(){const mismatch=$("setup-confirm").value.length>0&&$("setup-password").value!==$("setup-confirm").value;$("setup-confirm").classList.toggle("invalid",mismatch);$("setup-error").textContent=mismatch?t("admin.setup.error.mismatch"):""}$("setup-password").addEventListener("input",()=>{strengthView();validateSetupMatch()});$("setup-confirm").addEventListener("input",validateSetupMatch);$("setup-form").addEventListener("submit",async e=>{e.preventDefault();const p=$("setup-password").value,c=$("setup-confirm").value,field=$("setup-confirm");field.classList.toggle("invalid",p!==c);if(!p){$("setup-error").textContent=t("admin.setup.error.required");return}if(p!==c){$("setup-error").textContent=t("admin.setup.error.mismatch");field.focus();return}try{await request("/admin/setup",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({password:p})});$("setup-form").reset();await loadStatus();startPolling()}catch(e){$("setup-error").textContent=t("admin.setup.error.save",{error:e.message})}});$("login-form").addEventListener("submit",async e=>{e.preventDefault();const password=$("login-password").value;if(!password){$("login-error").textContent=t("admin.setup.error.required");return}try{await request("/admin/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({password})});$("login-form").reset();await loadStatus();startPolling()}catch(e){$("login-error").textContent=e.status===401?t("admin.login.error"):e.message}});
let modalOpener=null;function openModal(id,focusId){modalOpener=document.activeElement;$(id).classList.remove("hidden");$(focusId).focus()}function closeModal(id){$(id).classList.add("hidden");if(modalOpener?.isConnected)modalOpener.focus();modalOpener=null}
$("save-button").addEventListener("click",()=>{const port=Number($("port").value);if(port!==Number(currentStatus?.port)){$("confirm-port-copy").textContent=t("admin.port_dialog.copy",{port});openModal("confirm-port","confirm-port-save")}else saveSettings()});$("confirm-port-save").addEventListener("click",()=>{closeModal("confirm-port");saveSettings()});$("restart-button").addEventListener("click",()=>restart().catch(e=>error(`${t("admin.restart.failed")}：${e.message}`)));document.querySelectorAll("[data-modal-cancel]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.modalCancel)));
$("change-password").addEventListener("click",()=>openModal("password-modal","current-password"));$("password-form").addEventListener("input",()=>{const next=$("new-password").value,confirm=$("new-password-confirm").value,mismatch=confirm.length>0&&next!==confirm;$("new-password-confirm").classList.toggle("invalid",mismatch);$("password-error").textContent=mismatch?t("admin.password.mismatch"):""});$("password-form").addEventListener("submit",async e=>{e.preventDefault();const next=$("new-password").value,confirm=$("new-password-confirm").value;if(!next||next!==confirm){$("password-error").textContent=t(next?"admin.password.mismatch":"admin.setup.error.required");$("new-password-confirm").classList.toggle("invalid",next!==confirm);return}try{await request("/admin/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password:$("current-password").value,new_password:next})});closeModal("password-modal");$("password-form").reset();showLogin(t("admin.password.changed"))}catch(e){if(e.status===401){closeModal("password-modal");showLogin(t("admin.login.expired"))}else $("password-error").textContent=t("admin.password.error",{error:e.message})}});
$("copy-node-id").addEventListener("click",async()=>{if(!currentStatus?.node_id)return;try{await navigator.clipboard.writeText(currentStatus.node_id);toast(`${t("admin.copy.success")} ✓`)}catch(e){error(t("admin.error.request",{error:e.message}))}});
$("theme-toggle").addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;document.documentElement.dataset.themeChoice="saved";localStorage.setItem("macbot-admin-theme",next);$("theme-toggle").textContent=t(next==="dark"?"admin.theme.light":"admin.theme.dark")});$("theme-toggle").textContent=t(document.documentElement.dataset.theme==="dark"?"admin.theme.light":"admin.theme.dark");prefersDark.addEventListener?.("change",e=>{if(!localStorage.getItem("macbot-admin-theme")){document.documentElement.dataset.theme=e.matches?"dark":"light";$("theme-toggle").textContent=t(e.matches?"admin.theme.light":"admin.theme.dark")}});
$("logout-button").addEventListener("click",async()=>{try{await request("/admin/logout",{method:"POST"});clearInterval(pollTimer);pollTimer=null;showLogin()}catch(e){if(e.status===401)showLogin(t("admin.login.expired"));else error(e.message)}});$("live-toggle").addEventListener("click",()=>{liveLogs=!liveLogs;$("live-toggle").setAttribute("aria-pressed",String(liveLogs));$("log-window").setAttribute("aria-live",liveLogs?"polite":"off");if(liveLogs)loadLogs(logOffset===0).catch(e=>error(t("admin.logs.load_error",{error:e.message})))});document.querySelectorAll("[data-log-filter]").forEach(b=>b.addEventListener("click",()=>{logFilter=b.dataset.logFilter;document.querySelectorAll("[data-log-filter]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderLogs()}));document.addEventListener("keydown",e=>{const modal=$("password-modal").classList.contains("hidden")?($("confirm-port").classList.contains("hidden")?null:$("confirm-port")):$("password-modal");if(e.key==="Escape"&&modal){closeModal(modal.id);return}if(e.key==="Tab"&&modal){const controls=[...modal.querySelectorAll("button:not(:disabled),input:not(:disabled)")];if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});strengthView();refresh();startPolling();
