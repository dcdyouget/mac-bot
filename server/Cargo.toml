[workspace]
resolver = "2"
# Keep every crate with a target in the workspace.  `macbot-usage` is added as
# soon as its source target lands; until then the explicit list keeps Cargo
# usable by all development lines.
members = [
    "crates/macbot-browser",
    "crates/macbot-durable",
    "crates/macbot-gateway",
    "crates/macbot-memory",
    "crates/macbot-orchestrator",
    "crates/macbot-providers",
    "crates/macbot-skills",
    "crates/macbot-store",
    "crates/macbot-tools",
    "crates/macbot-usage",
    "macbotd",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = "1"
mime_guess = "2"
password-hash = "0.5"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tower = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
